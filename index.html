<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anta&family=Righteous&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <h1 class="site-header__title">
            Student Services
        </h1>
        <p class="site-header__sub">
            Registration
        </p>
    </header>
    <main class="content">
        <form class="register-form" action="#" method="post">

            <fieldset class="register-form__group">

                <legend class="register-form__legend">Your Information</legend>

                <!-- Textbox -->
                <label class="register-form__label" for="studentName">Your Full Name</label>
                <input class="register-form__input" type="text" id="studentName" name="studentName">

                <!-- E-mail -->
                <label class="register-form__label" for="studentEmail">Your E-mail</label>
                <input class="register-form__input" type="email" id="studentEmail" name="studentEmail">
                
               
                <!-- Checkboxes -->
                <label class="register-form__label" for="studentCourse">Courses</label> 
                <input class="register-form__input" type="checkbox" id="studentCourse" name="studentCourse">                
                
                <!-- Dropdown -->
                <label class="register-form__label" for="studentLanguage">Primary Language</label>
                <select class="register-form__language" id="studentLanguage" name="studentLanguage">
                    <option value="">Select</option>
                    <option value="english">English</option>
                    <option value="french">French</option>
                    <option value="other">Other</option>
                </select> 

                <!-- Date Picker -->
                <label class="register-form__label" for="studentStart">Start Date</label>
                <input class="register-form__input" type="date" id="studentStart" name="studentStart">                
                
                <!-- Tel Input -->
                <label class="register-form__label" for="studentPhone">Mobile Number</label>
                <input class="register-form__input" type="tel" id="studentPhone" name="studentPhone">
            </fieldset>     
            <fieldset class="register-form__group">
                <legend class="register-form__legend">Gender</legend>

                <input class="register-form__radio" type="radio" id="genderFemale" name="studentGender" value="Female">
                <label class="register-form__label" for="genderFemale">Female</label>
                <input class="register-form__radio" type="radio" id="genderMale" name="studentGender" value="Male">
                <label class="register-form__label" for="genderMale">Male</label>
                <input class="register-form__radio" type="radio" id="genderOther" name="studentGender" value="Other">
                <label class="register-form__label" for="genderOther">Other</label>
                
            </fieldset>
        </form>
    </main>
</body>
</html>
