<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anta&family=Righteous&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <h1 class="site-header__title">
            Student Services
        </h1>

    <p class="site-header__sub">
            Registration
    </p>
        
    </header>
    <main class="content">
        <form class="register-form" action="#" method="post">

            <fieldset class="register-form__group">

                <legend class="register-form__legend">Your Information</legend>

                <label class="register-form__label" for="studentName">Full Name</label>
                <input class="register-form__input" type="text" id="studentName" name="studentName" placeholder="Jane Doe">

                <label class="register-form__label" for="studentEmail" >E-mail</label>
                <input class="register-form__input" type="email" id="studentEmail" name="studentEmail" placeholder="example@example.com">             
                
                <label class="register-form__label" for="studentLanguage">Primary Language</label>
                <select class="register-form__input" id="studentLanguage" name="studentLanguage">
                    <option value="">Select</option>
                    <option value="english">English</option>
                    <option value="french">French</option>
                    <option value="other">Other</option>
                </select> 

                <label class="register-form__label" for="studentStart">Start Date</label>
                <input class="register-form__input" type="date" id="studentStart" name="studentStart">                
                
                <label class="register-form__label" for="studentPhone">Mobile Number</label>
                <input class="register-form__input" type="tel" id="studentPhone" name="studentPhone" placeholder="999-999-9999">

            </fieldset>     
            <fieldset class="register-form__group">

                <legend class="register-form__legend">Gender</legend>

                <div class="register-form__option">
                    <input class="register-form__radio" type="radio" id="genderFemale" name="studentGender" value="Female">
                    <label class="register-form__label" for="genderFemale">Female</label>
                </div>
                <div class="register-form__option">
                    <input class="register-form__radio" type="radio" id="genderMale" name="studentGender" value="Male">
                    <label class="register-form__label" for="genderMale">Male</label>
                </div>
                <div class="register-form__option">    
                    <input class="register-form__radio" type="radio" id="genderOther" name="studentGender" value="Other">
                    <label class="register-form__label" for="genderOther">Other</label>
                </div>
                
            </fieldset>
            <fieldset class="register-form__group">

                <legend class="register-form__legend">Courses</legend>

                <div class="register-form__option">
                    <input class="register-form__checkbox" type="checkbox" id="madd8010" name="studentCourse" value="madd8010">
                    <label class="register-form__label" for="madd8010">MADD8010</label>
                </div>
                <div class="register-form__option">
                    <input class="register-form__checkbox" type="checkbox" id="madd9011" name="studentCourse" value="madd9011">
                    <label class="register-form__label" for="madd9011">MADD9011</label>
                </div>
                <div class="register-form__option">
                    <input class="register-form__checkbox" type="checkbox" id="madd9013" name="studentCourse" value="madd9013">
                    <label class="register-form__label" for="madd9013">MADD9013</label>
                </div>
                 <div class="register-form__option">
                    <input class="register-form__checkbox" type="checkbox" id="madd9014" name="studentCourse" value="madd9014">
                    <label class="register-form__label" for="madd9014">MADD9014</label>
                </div>
                <div class="register-form__option">
                    <input class="register-form__checkbox" type="checkbox" id="madd9112" name="studentCourse" value="madd9112">
                    <label class="register-form__label" for="madd9112">MADD9112</label>
                </div>
            </fieldset>
            <div class="register-form__action">
                <button class="register-form__submit" type="submit">Register</button>
            </div>
        </form>
    </main>
</body>
</html>
